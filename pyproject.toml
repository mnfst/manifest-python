[project]
name = "mnfst"
dynamic = ["version"]
readme = "README.md"
description = "Heal failing API requests on the fly."
requires-python = ">=3.10"
dependencies = ["httpx>=0.24,<1", "anyio>=4,<5"]

[project.urls]
Homepage = "https://manifest.build"
Repository = "https://github.com/mnfst/manifest-python"
Issues = "https://github.com/mnfst/manifest-python/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "requests>=2.31", "httpx2>=2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnfst"]

[tool.hatch.version]
path = "src/mnfst/version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
