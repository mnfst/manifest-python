name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m pip wheel --no-deps . --wheel-dir dist

  app-contract:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      HUSKY: 0
      HOST: 127.0.0.1
      PORT: '5310'
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_USER: phoenix
      DATABASE_PASSWORD: phoenix
      DATABASE_NAME: phoenix
      BETTER_AUTH_SECRET: sdk-conformance-only-secret-01234567890123456789
      BETTER_AUTH_URL: http://127.0.0.1:5310
      MNFST_TEST_APP_URL: http://127.0.0.1:5310
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phoenix
          POSTGRES_PASSWORD: phoenix
          POSTGRES_DB: phoenix
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U phoenix -d phoenix"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mnfst/app
          ref: 9ea359279577f99e4058b7600c75889b1a2c5881
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
        working-directory: app
      - run: npm run migration:run --workspace=backend
        working-directory: app
      - run: npm run build --workspace=backend
        working-directory: app
      - name: Start app
        working-directory: app
        run: |
          npm run start --workspace=backend > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --output /dev/null http://127.0.0.1:5310/api/auth/ok; then exit 0; fi
            sleep 1
          done
          cat /tmp/app.log
          exit 1
      - run: python -m pytest -q tests/test_live_app.py
      - name: App logs
        if: failure()
        run: cat /tmp/app.log || true
